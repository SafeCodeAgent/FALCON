[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "av-signal"
version = "0.1.0"
description = "Execution-grounded security feedback for code generation"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
rl = ["pandas>=2", "pyarrow>=15"]

[project.scripts]
av-repair = "av_signal.repair:main"
av-signal = "av_signal.signal:main"
av-heldout = "av_signal.heldout:main"

[tool.setuptools.packages.find]
include = ["av_signal*"]

[tool.setuptools.package-data]
av_signal = ["trace_runner.py", "heldout_runner.py"]
